# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Runs the publish step from action.yaml against a stub helm; needs no
# registry or credentials, so it runs on every pull request.
name: 'Stubbed publish tests 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  stub-tests:
    name: 'Stubbed publish tests'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: audit

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Run publish step tests against a stub helm'
        shell: bash
        run: |
          set -euo pipefail
          bash tests/publish-digest.sh
          bash tests/publish-metadata.sh
